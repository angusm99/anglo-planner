<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factory Terminal — Anglo Windows</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" sizes="192x192" href="/icons/factory-terminal-192.png">
<meta name="theme-color" content="#f6c945">
<script>
  try {
    const params = new URLSearchParams(location.search);
    const explicitStationChoice = params.get("select") === "1";
    const rememberedStation = document.cookie
      .split("; ")
      .find((part) => part.startsWith("factoryCoverStation="))
      ?.split("=")[1] || localStorage.getItem("factoryCoverStation");
    if (!explicitStationChoice && /^(4|5|6|8)$/.test(rememberedStation || "")) {
      location.replace(`/cover.html?station=${rememberedStation}`);
    }
  } catch (_) {}
</script>
<style>
  :root { --gold:#f6c945; --deep:#d99a16; --black:#0b0b09; --panel:#15140f; --muted:#aa9c6f; --mono:"Cascadia Mono",Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { min-height:100%; }
  body { color:var(--gold); font-family:var(--mono); background:radial-gradient(circle at 50% 0,rgba(246,201,69,.08),transparent 34%),linear-gradient(180deg,#11100c 0%,var(--black) 65%); }
  main { width:100%; max-width:760px; margin:auto; padding:16px 14px 24px; }
  .hero { text-align:center; margin-bottom:13px; }
  .logo { display:block; width:min(390px,78vw); max-height:134px; object-fit:contain; margin:0 auto 3px; filter:sepia(1) saturate(5) drop-shadow(0 2px 8px rgba(246,201,69,.18)); }
  .subtitle { font-size:12px; letter-spacing:.42em; text-indent:.42em; font-weight:700; }
  .statusline { margin-top:8px; font-size:9px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; }
  .statusline .on { color:#5ee2a7; }
  .statusline .off { color:#ff7a72; }
  .menu { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  button { font-family:inherit; touch-action:manipulation; }
  .station { min-width:0; min-height:88px; padding:11px 12px; text-align:left; cursor:pointer; color:var(--gold); background:linear-gradient(145deg,rgba(246,201,69,.035),transparent 70%); border:1.5px solid rgba(246,201,69,.72); border-radius:8px; box-shadow:inset 0 0 0 1px rgba(246,201,69,.035); }
  .station:active,.qr-button:active { transform:scale(.98); background:var(--gold); color:#0a0906; }
  .station-no { display:block; font-size:10px; letter-spacing:.16em; font-weight:700; opacity:.72; }
  .station-name { display:block; font-size:clamp(13px,3.25vw,17px); line-height:1.12; font-weight:800; margin-top:7px; text-transform:uppercase; }
  .operator { display:block; margin-top:7px; font-size:clamp(8px,2.05vw,10px); line-height:1.25; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; }
  .station:active .station-no,.station:active .operator { color:#0a0906; }
  .qr-button { width:100%; min-height:62px; margin-top:11px; cursor:pointer; color:#0a0906; background:linear-gradient(135deg,var(--gold),var(--deep)); border:0; border-radius:8px; font-size:13px; font-weight:900; letter-spacing:.06em; }
  .terminal-mode { width:100%; min-height:52px; margin-top:9px; cursor:pointer; color:var(--gold); background:rgba(246,201,69,.035); border:1.5px solid rgba(246,201,69,.72); border-radius:8px; font-size:12px; font-weight:900; letter-spacing:.08em; }
  .terminal-mode:active,.terminal-mode[aria-pressed="true"] { background:var(--gold); color:#0a0906; }
  .terminal-mode-note { min-height:16px; margin-top:6px; text-align:center; color:#ff7a72; font-size:10px; }
  footer { text-align:center; margin-top:16px; color:#766d4f; font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
  .modal { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.84); }
  .modal.open { display:flex; }
  .modal-card { width:min(520px,100%); max-height:calc(100vh - 24px); overflow:auto; padding:18px; border:1.5px solid var(--gold); border-radius:10px; background:#15140f; }
  .modal-head { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .close { width:42px; height:42px; color:var(--gold); background:transparent; border:1px solid #665a34; border-radius:7px; font-size:20px; }
  video { display:none; width:100%; max-height:46vh; margin-top:13px; border-radius:8px; background:#000; }
  video.active { display:block; }
  .scan-note { margin:10px 0; color:var(--muted); font-size:12px; line-height:1.45; }
  textarea { width:100%; min-height:76px; padding:12px; color:#f4f0df; background:#0c0c09; border:1px solid #665a34; border-radius:7px; font:16px var(--mono); resize:vertical; }
  .paste-go { width:100%; min-height:52px; margin-top:8px; color:#0a0906; background:var(--gold); border:0; border-radius:7px; font-weight:800; }
  .error { min-height:18px; margin-top:8px; color:#ff7a72; font-size:12px; }
  @media (max-width:390px) { main{padding:10px 9px 18px}.menu{gap:7px}.station{padding:9px;min-height:82px}.logo{max-height:105px}.operator{letter-spacing:0} }
</style>
</head>
<body>
<main>
  <div class="hero">
    <img class="logo" src="/anglo-logo.png" alt="Anglo Windows">
    <div class="subtitle">FACTORY TERMINAL</div>
    <div class="statusline"><span id="sysDot" class="on">●</span> <span id="sys">CONNECTING…</span> · <span id="sheetState">CHECKING SHEET…</span> · <span id="clock">—</span></div>
  </div>
  <div class="menu" id="stations"></div>
  <button class="qr-button" id="openQr" type="button">▣ &nbsp; SCAN COVER-SHEET QR CODE</button>
  <button class="terminal-mode" id="terminalModeBtn" type="button">LOCK FULLSCREEN</button>
  <div class="terminal-mode-note" id="terminalModeMessage" aria-live="polite"></div>
  <footer>Select your station to begin · Cape Town manufacturing</footer>
</main>

<div class="modal" id="qrModal" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="modal-card">
    <div class="modal-head"><h2 id="qrTitle">Scan cover-sheet QR</h2><button class="close" id="closeQr" aria-label="Close">×</button></div>
    <p class="scan-note" id="scanNote">Point the rear camera at the QR code. You can also paste its contents below.</p>
    <video id="qrVideo" playsinline muted></video>
    <textarea id="qrPaste" placeholder="Paste QR text here"></textarea>
    <button class="paste-go" id="parseQr" type="button">OPEN JOB</button>
    <div class="error" id="qrError"></div>
  </div>
</div>

<script src="/common.js"></script>
<script src="/qr.js"></script>
<script>
const $ = (id) => document.getElementById(id);
startClock($("clock"));
bindTerminalModeButton($("terminalModeBtn"));
fetch("/api/stations").then(r => r.json()).then(stations => {
  $("sys").textContent = "ONLINE";
  for (const [num, st] of Object.entries(stations)) {
    const b = document.createElement("button");
    b.className = "station";
    b.innerHTML = `<span class="station-no">STATION ${esc(num)}</span><span class="station-name">${esc(st.name)}</span><span class="operator">PRIMARY OPERATOR · ${esc(st.responsible)}</span>`;
    b.onclick = () => location.href = `/station/${num}`;
    $("stations").appendChild(b);
  }
}).catch(() => {
  $("sys").textContent = "OFFLINE — SERVER UNREACHABLE";
  $("sysDot").className = "off";
});
fetch("/api/capabilities").then(r => r.json()).then(state => {
  $("sheetState").textContent = state.sheet ? "GOOGLE SHEET MASTER CONNECTED" : "LOCAL PREVIEW — SHEET OFF";
  $("sheetState").className = state.sheet ? "on" : "off";
}).catch(() => {
  $("sheetState").textContent = "SHEET STATUS UNAVAILABLE";
  $("sheetState").className = "off";
});

let stopScanner = null;
function routeQr(raw) {
  try {
    const parsed = AngloQR.parseQrPayload(raw);
    location.href = AngloQR.routeFor(parsed);
  } catch (err) { $("qrError").textContent = err.message; }
}
async function openQr() {
  $("qrModal").classList.add("open");
  $("qrError").textContent = "";
  if (!AngloQR.cameraSupported()) {
    $("scanNote").textContent = "Camera QR scanning is not supported in this browser. Paste the QR contents below.";
    $("qrPaste").focus();
    return;
  }
  try {
    stopScanner = await AngloQR.startScanner($("qrVideo"), routeQr, (msg) => { $("qrError").textContent = msg; });
    $("qrVideo").classList.add("active");
  } catch (err) {
    $("scanNote").textContent = "Camera unavailable. Paste the QR contents below.";
    $("qrError").textContent = err.message;
    $("qrPaste").focus();
  }
}
function closeQr() {
  if (stopScanner) stopScanner();
  stopScanner = null;
  $("qrVideo").classList.remove("active");
  $("qrModal").classList.remove("open");
}
$("openQr").onclick = openQr;
$("closeQr").onclick = closeQr;
$("parseQr").onclick = () => routeQr($("qrPaste").value);
$("qrModal").addEventListener("click", (e) => { if (e.target === $("qrModal")) closeQr(); });
</script>
</body>
</html>
