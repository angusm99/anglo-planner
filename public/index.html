<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Terminal — Anglo Windows</title>
<!-- Fonts load non-blocking: page paints instantly with system fallbacks,
     Playfair/Space Mono swap in if/when they arrive (kiosk-safe on slow wifi). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap"></noscript>
<style>
  /* Neon Factory Terminal. Google Fonts with system fallbacks so it still
     renders if wifi drops. Warm amber neon lifted from the Manus 'neon' build. */
  :root {
    --gold: #fcd34d;
    --gold-deep: #f59e0b;
    --serif: "Playfair Display", "Iowan Old Style", Georgia, serif;
    --mono: "Space Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--mono);
    color: var(--gold);
    background:
      radial-gradient(circle at 20% 30%, rgba(252,211,77,0.10), transparent 45%),
      radial-gradient(circle at 82% 85%, rgba(245,158,11,0.08), transparent 45%),
      linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  /* animated scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 2px);
    animation: scan 8s linear infinite;
  }
  @keyframes scan { from { transform: translateY(0); } to { transform: translateY(10px); } }

  main { width: 100%; max-width: 860px; padding: 34px 20px 48px; position: relative; z-index: 1; }

  .hero { text-align: center; margin-bottom: 30px; }
  .logo { filter: drop-shadow(0 0 8px rgba(252,211,77,0.7)); margin-bottom: 14px; }
  .brand {
    font-family: var(--serif); font-weight: 900; line-height: 1.05;
    font-size: clamp(40px, 9vw, 68px); letter-spacing: 0.02em;
    color: var(--gold);
    text-shadow: 0 0 8px var(--gold), 0 0 15px var(--gold), 0 0 25px var(--gold-deep), 0 0 45px rgba(252,211,77,0.6);
  }
  .sub {
    font-size: clamp(11px, 2.4vw, 14px); letter-spacing: 0.42em; text-indent: 0.42em;
    color: rgba(252,211,77,0.75); margin-top: 14px;
    text-shadow: 0 0 5px rgba(252,211,77,0.5);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { text-shadow: 0 0 10px var(--gold), 0 0 22px var(--gold-deep); } }
  .statusline {
    font-size: 11px; letter-spacing: 0.14em; color: rgba(252,211,77,0.6);
    margin-top: 12px; text-transform: uppercase;
  }
  .statusline .on { color: #4ade80; text-shadow: 0 0 6px rgba(74,222,128,0.8); }
  .statusline .off { color: #f87171; text-shadow: 0 0 6px rgba(248,113,113,0.8); }

  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  button.station {
    font-family: var(--mono); text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 18px;
    background: transparent; color: var(--gold);
    border: 2px solid var(--gold); border-radius: 4px;
    padding: 20px 22px; min-height: 92px;
    letter-spacing: 0.04em; touch-action: manipulation;
    box-shadow: 0 0 10px rgba(252,211,77,0.35), inset 0 0 10px rgba(252,211,77,0.08);
    text-shadow: 0 0 4px rgba(252,211,77,0.5);
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  button.station:hover {
    transform: translateY(-3px);
    background: rgba(252,211,77,0.12);
    box-shadow: 0 0 22px var(--gold), 0 0 36px var(--gold-deep), inset 0 0 14px rgba(252,211,77,0.18);
  }
  button.station:active {
    transform: translateY(-1px);
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: #000; text-shadow: none;
    box-shadow: 0 0 25px var(--gold), 0 0 40px var(--gold-deep), inset 0 0 12px rgba(255,255,255,0.3);
  }
  button.station .num {
    font-family: var(--serif); font-weight: 900; font-size: 40px; min-width: 46px; text-align: center;
    text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold-deep);
  }
  button.station:active .num { text-shadow: none; }
  button.station .name { display: block; font-size: 19px; font-weight: 700; text-transform: uppercase; }
  button.station .who { display: block; font-size: 12px; letter-spacing: 0.14em; color: rgba(252,211,77,0.55); margin-top: 6px; text-transform: uppercase; }
  button.station:active .who { color: rgba(0,0,0,0.65); }

  footer { text-align: center; font-size: 11px; letter-spacing: 0.16em; color: rgba(252,211,77,0.4); margin-top: 30px; line-height: 2; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <svg class="logo" width="92" height="76" viewBox="0 0 86 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M6 70V34a37 37 0 0 1 74 0v36" stroke="var(--gold)" stroke-width="2.4"/>
      <path d="M43 6v64M6 46h74" stroke="var(--gold)" stroke-width="1.6" opacity="0.9"/>
      <path d="M22 22.5A30 30 0 0 1 64 22.5" stroke="var(--gold)" stroke-width="1.4" opacity="0.6"/>
    </svg>
    <div class="brand">ANGLO WINDOWS</div>
    <div class="sub">FACTORY TERMINAL</div>
    <div class="statusline">
      <span id="sysDot" class="on">●</span> <span id="sys">CONNECTING…</span>
      &nbsp;·&nbsp; GOOGLE SHEET · MASTER &nbsp;·&nbsp; <span id="clock">—</span>
    </div>
  </div>

  <div class="menu" id="stations"></div>

  <footer>Select your station to begin · Cape Town Manufacturing</footer>
</main>

<script src="/common.js"></script>
<script>
startClock(document.getElementById("clock"));
fetch("/api/stations").then(r => r.json()).then(stations => {
  document.getElementById("sys").textContent = "ONLINE";
  const wrap = document.getElementById("stations");
  for (const [num, st] of Object.entries(stations)) {
    const b = document.createElement("button");
    b.className = "station";
    b.innerHTML = `<span class="num">${num}</span>
      <span><span class="name">${esc(st.name)}</span><span class="who">${esc(st.responsible)}</span></span>`;
    b.onclick = () => location.href = `/station/${num}`;
    wrap.appendChild(b);
  }
}).catch(() => {
  document.getElementById("sys").textContent = "OFFLINE — SERVER UNREACHABLE";
  document.getElementById("sysDot").className = "off";
});
</script>
</body>
</html>
