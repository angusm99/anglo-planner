<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Terminal — Anglo Windows</title>
<style>
  /* Factory Terminal — amber CRT. Self-contained (no external fonts/images) so
     it never breaks on a kiosk with flaky wifi. */
  :root {
    --amber: #f0c419;
    --amber-hi: #ffe27a;
    --amber-dim: rgba(240, 196, 25, 0.5);
    --amber-faint: rgba(240, 196, 25, 0.14);
    --ink: #0a0906;
    --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Courier New", monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 50% 22%, rgba(240,196,25,0.10), transparent 55%),
      radial-gradient(circle at 50% 120%, rgba(240,196,25,0.06), transparent 60%),
      var(--ink);
    color: var(--amber);
    font-family: var(--mono);
    min-height: 100%;
    display: flex; align-items: flex-start; justify-content: center;
  }
  /* scanlines + vignette overlay */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 30;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.28) 2px 3px),
      radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,0.55));
    mix-blend-mode: multiply;
  }
  main { width: 100%; max-width: 760px; padding: 22px 16px 40px; position: relative; z-index: 1; }

  .frame {
    border: 1px solid var(--amber-dim);
    border-radius: 6px;
    padding: 30px 22px 26px;
    background: linear-gradient(180deg, rgba(240,196,25,0.05), transparent 30%);
    box-shadow: inset 0 0 40px rgba(240,196,25,0.06), 0 0 30px rgba(0,0,0,0.6);
    animation: flick 6s infinite;
  }
  @keyframes flick { 0%,97%,100% { opacity: 1; } 98% { opacity: 0.93; } }

  /* header */
  .head { text-align: center; margin-bottom: 22px; }
  .logo { filter: drop-shadow(0 0 6px rgba(240,196,25,0.6)); }
  .wordmark {
    font-family: var(--serif); font-size: 15px; letter-spacing: 0.5em;
    text-indent: 0.5em; color: var(--amber-hi); margin: 14px 0 4px;
  }
  .title {
    font-size: clamp(26px, 7vw, 40px); font-weight: 700; letter-spacing: 0.14em;
    text-shadow: 0 0 10px rgba(240,196,25,0.55), 0 0 2px rgba(240,196,25,0.9);
  }
  .rule { height: 1px; background: linear-gradient(90deg, transparent, var(--amber-dim), transparent); margin: 16px 0; }
  .prompt {
    text-align: center; letter-spacing: 0.22em; font-size: 13px; color: var(--amber);
    margin-bottom: 14px;
  }
  .prompt .car { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* status strip */
  .status {
    display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: center;
    font-size: 12px; letter-spacing: 0.08em; color: #d8d2c0; margin-bottom: 22px;
  }
  .status b { color: var(--amber); font-weight: 400; }
  .dot { color: #3cc796; text-shadow: 0 0 6px rgba(60,199,150,0.8); }
  .dot.off { color: #ff7a72; text-shadow: 0 0 6px rgba(255,122,114,0.8); }

  /* station grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  button.st {
    font-family: var(--mono); text-align: left; cursor: pointer;
    background: rgba(240,196,25,0.03); color: var(--amber);
    border: 1px solid var(--amber-dim); border-radius: 5px;
    padding: 16px 18px; min-height: 84px; display: flex; align-items: center; gap: 16px;
    touch-action: manipulation; transition: background .12s, box-shadow .12s, border-color .12s;
  }
  button.st:hover { border-color: var(--amber); box-shadow: 0 0 14px rgba(240,196,25,0.25); }
  button.st:active { background: var(--amber); color: var(--ink); box-shadow: 0 0 22px rgba(240,196,25,0.6); }
  button.st .num {
    font-size: 30px; font-weight: 700; min-width: 44px; text-align: center;
    text-shadow: 0 0 10px rgba(240,196,25,0.5);
  }
  button.st:active .num { text-shadow: none; }
  button.st .name { display: block; font-size: 18px; letter-spacing: 0.03em; text-transform: uppercase; }
  button.st .who { display: block; font-size: 12px; letter-spacing: 0.12em; color: var(--amber-dim); margin-top: 5px; text-transform: uppercase; }
  button.st:active .who { color: rgba(10,9,6,0.7); }

  footer { text-align: center; font-size: 11px; color: var(--amber-dim); letter-spacing: 0.12em; margin-top: 24px; line-height: 2; }
</style>
</head>
<body>
<main>
  <div class="frame">
    <div class="head">
      <!-- Anglo half-arch window mark -->
      <svg class="logo" width="86" height="72" viewBox="0 0 86 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 70V34a37 37 0 0 1 74 0v36" stroke="var(--amber)" stroke-width="2.4"/>
        <path d="M43 6v64M6 46h74" stroke="var(--amber)" stroke-width="1.6" opacity="0.85"/>
        <path d="M22 22.5A30 30 0 0 1 64 22.5" stroke="var(--amber)" stroke-width="1.4" opacity="0.6"/>
      </svg>
      <div class="wordmark">ANGLO&nbsp;&nbsp;WINDOWS</div>
      <div class="title">FACTORY TERMINAL</div>
    </div>

    <div class="rule"></div>
    <div class="prompt">SELECT YOUR STATION <span class="car">█</span></div>

    <div class="status">
      <span><b>STATUS</b> <span class="dot" id="sysDot">●</span> <span id="sys">CONNECTING…</span></span>
      <span><b>SOURCE</b> GOOGLE SHEET · MASTER</span>
      <span><b>TIME</b> <span id="clock">—</span></span>
    </div>

    <div class="grid" id="stations"></div>

    <footer>
      ANGLO WINDOWS &middot; PRODUCTION MANAGEMENT SYSTEM<br>
      CAPE TOWN MANUFACTURING
    </footer>
  </div>
</main>

<script src="/common.js"></script>
<script>
startClock(document.getElementById("clock"));
fetch("/api/stations").then(r => r.json()).then(stations => {
  document.getElementById("sys").textContent = "ONLINE";
  const wrap = document.getElementById("stations");
  for (const [num, st] of Object.entries(stations)) {
    const b = document.createElement("button");
    b.className = "st";
    b.innerHTML = `<span class="num">${num}</span>
      <span><span class="name">${esc(st.name)}</span><span class="who">${esc(st.responsible)}</span></span>`;
    b.onclick = () => location.href = `/station/${num}`;
    wrap.appendChild(b);
  }
}).catch(() => {
  document.getElementById("sys").textContent = "OFFLINE — SERVER UNREACHABLE";
  document.getElementById("sysDot").classList.add("off");
});
</script>
</body>
</html>
