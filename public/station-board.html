<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station job board</title><link rel="stylesheet" href="/station-board.css"></head>
<body><header><div class="heading"><div><small>ANGLO WINDOWS · FACTORY TERMINAL</small><h1 id="title">STATION JOB BOARD</h1></div><strong id="stationNumber"></strong></div><nav><a id="operator">Change operator</a> <a id="single">Single updates / REDO</a></nav></header>
<main><nav id="stations" hidden><a href="/foreman-board?station=4">SAW 1</a> <a href="/foreman-board?station=5">SAW 2</a> <a href="/foreman-board?station=8">BEAD SAW</a> <button id="login">Foreman sign in</button></nav>
<p id="notice" role="status">Loading…</p><div id="metrics"></div><label>OPERATOR NAME <input id="actor" maxlength="100" autocomplete="name" placeholder="Type operator name"></label> <button id="add" disabled>Add job</button> <button id="refresh">Refresh</button><p id="source"></p><div id="days"></div></main>
<dialog id="allocation"><form id="allocationForm"><h2 id="allocationTitle">Add job to this station</h2><label>Job reference <input id="search" placeholder="Search reference or customer"></label><button type="button" id="find">Find</button><label>Master planner job <select id="job" required></select></label><label>Install day <select id="day" required></select></label><p>Off-calendar reason: <strong>MANUAL ISSUE</strong></p><label>Issued by (required off calendar) <input id="issuer" maxlength="100" placeholder="Type the name of who issued this job"></label><label>Foreman note <textarea id="note" maxlength="500"></textarea></label><p id="allocationError" role="alert"></p><button type="submit">Save allocation</button> <button type="button" id="cancel">Cancel</button></form></dialog>
<script src="/station-board.js"></script></body></html>
